name: mediscope-bigdata
x-hadoop: &hadoop
  image: apache/hadoop:3.4.3
  env_file: hadoop.env
  restart: unless-stopped
  volumes:
    - ../:/workspace:ro
  mem_limit: 1500m
services:
  hadoop-volume-init:
    image: apache/hadoop:3.4.3
    user: "0:0"
    entrypoint: ["sh", "/workspace/docker/init_hdfs.sh"]
    restart: "no"
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name
      - datanode_data:/tmp/hadoop-hadoop/dfs/data
      - ../:/workspace:ro
  mongodb:
    image: mongo:7.0.41-jammy
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1000m
  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    depends_on:
      hadoop-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - namenode_data:/tmp/hadoop-hadoop/dfs/name
      - ../:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report | grep -q 'Live datanodes (1)'" ]
      interval: 20s
      timeout: 10s
      retries: 15
    mem_limit: 1500m
  datanode:
    <<: *hadoop
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      hadoop-volume-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started
    volumes:
      - datanode_data:/tmp/hadoop-hadoop/dfs/data
      - ../:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report | grep -q 'Live datanodes (1)'" ]
      interval: 20s
      timeout: 10s
      retries: 15
    mem_limit: 1500m
  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "yarn node -list 2>/dev/null | grep -Eq 'Total Nodes: *1'" ]
      interval: 20s
      timeout: 10s
      retries: 15
    mem_limit: 1500m
  nodemanager:
    <<: *hadoop
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on:
      - resourcemanager
      - datanode
    mem_limit: 1500m
volumes:
  mongo_data:
  namenode_data:
  datanode_data:
