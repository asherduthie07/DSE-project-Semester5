[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mediscope-ai"
version = "0.1.0"
description = "Research-only healthcare analytics project foundation"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
prep = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4"]
# Installed only when their later-phase code is implemented.
analysis = ["numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4", "seaborn>=0.13,<1", "plotly>=6,<7"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pymongo>=4,<5"]

[project.scripts]
mediscope = "mediscope.cli:main"

[tool.setuptools.packages.find]
include = ["mediscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
